# Server Configuration
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application & Profiles
spring.application.name=food-rescue-api
spring.profiles.activee=dev

# PostgreSQL Datasource Configuration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodrescue}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sahil@1234}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration (TRD 2.2)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Configurable Business Rule Parameters (Brain.md Section 11 & TRD Section 4)
app.business-rules.default-discovery-radius-km=10
app.business-rules.claim-accept-timeout-minutes=10
app.business-rules.meal-weight-grams=350
app.business-rules.co2e-per-kg-saved=2.5
app.business-rules.max-otp-attempts=5

# OpenAPI / Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
